<!DOCTYPE html>
<html>
<head>
    <title>Fear and Greed Index</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 40px; background-color: #f8f9fa; }
        img { max-width: 90%; height: auto; border: 1px solid #ccc; box-shadow: 2px 2px 8px rgba(0,0,0,0.1); }
        .btn { display: inline-block; margin: 20px 0; padding: 10px 20px; background-color: #007bff; color: white; text-decoration: none; border-radius: 4px; }
        .btn:hover { background-color: #0056b3; }
        .flash-success { color: green; }
        .flash-danger { color: red; }
    </style>
</head>
<body>
    <h1>📊 Fear & Greed Index</h1>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, msg in messages %}
          <p class="flash-{{ category }}">{{ msg }}</p>
        {% endfor %}
      {% endif %}
    {% endwith %}
    <a href="{{ url_for('main.refresh') }}" class="btn">Refresh Chart</a>
    <div>
        <img src="{{ url_for('static', filename='latest_plot.png') }}" alt="Plot Not Found">
    </div>
</body>
</html>
